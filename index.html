    <div class="modal" id="settings-modal" style="display:none;"></div>

    <script>
        let state = {
            notes: JSON.parse(localStorage.getItem('wanwan_notes_v3')) || [],
            settings: JSON.parse(localStorage.getItem('wanwan_settings_v3')) || {
                name: '宛宛',
                signature: '',
                nameColor: '#333333',
                textColorR: 51, textColorG: 51, textColorB: 51,
                themeColor: '#ff9a9e',
                fontSize: 14,
                previewLines: 3,
                showCharm: true,
                charmSize: 60,
                charmSwing: 8,
                charmX: 20,
                charmY: 10,
                frameStyle: 'st',
                customFrameImg: '',
                frameScale: 1,
                avatarOffsetX: 0,
                avatarOffsetY: 0,
                avatarScale: 1,
                bgImage: '',
                currentAvatar: 'https://via.placeholder.com/150',
                charmImage: '',
                historyAvatars: [],
                historyBgs: [],
                currentFont: 'system',
                fontPresets: [],
                currentFrame: 'st',
                framePresets: [],
                bgNote: '', bgTodo: '', bgPomodoro: '',
                lastMode: 'note'
            },
            tempImages: [], filterTag: null, blockedTags: [], searchQuery: '',
            editingId: null, filterDateFrom: null, filterDateTo: null,
            specialDays: [], specialPinnedId: null,
            commentPreviewName: '宛宛',
            commentPreviewSuffix: '说：',
            commentPreviewEnabled: true,
            commentPreviewSyncName: false
        };
        // 读取追评预览设置
        try {
            const cp = JSON.parse(localStorage.getItem('wanwan_comment_preview'));
            if (cp) {
                if (cp.enabled !== undefined) state.commentPreviewEnabled = cp.enabled;
                if (cp.name !== undefined) state.commentPreviewName = cp.name;
                if (cp.suffix !== undefined) state.commentPreviewSuffix = cp.suffix;
                if (cp.syncName !== undefined) state.commentPreviewSyncName = cp.syncName;
            }
        } catch(e) {}
        // 读取 Special Days
        try {
            const sd = JSON.parse(localStorage.getItem('wanwan_special_days'));
            if (sd) {
                if (sd.days) state.specialDays = sd.days;
                if (sd.pinnedId !== undefined) state.specialPinnedId = sd.pinnedId;
            }
        } catch(e) {}

        window.onload = () => {
            // 内置字体主列表（始终保持最新）
            const BUILTIN_FONTS = [
                { id: 'system',   name: '手机字体',  value: 'system-ui, -apple-system, sans-serif', isBuiltin: true },
                { id: 'msyh',     name: '现代黑体',  value: 'sans-serif', isBuiltin: true,
                  gfont: 'Noto+Sans+SC:wght@400', gname: 'Noto Sans SC' },
                { id: 'heiti',    name: '圆润黑体',  value: 'sans-serif', isBuiltin: true,
                  gfont: 'ZCOOL+KuaiLe', gname: 'ZCOOL KuaiLe' },
                { id: 'pingfang', name: '纤细体',    value: 'sans-serif', isBuiltin: true,
                  gfont: 'Noto+Sans+SC:wght@100', gname: 'Noto Sans SC' },
                { id: 'kaiti',    name: '小篆风',    value: 'serif', isBuiltin: true,
                  gfont: 'ZCOOL+XiaoWei', gname: 'ZCOOL XiaoWei' },
                { id: 'songti',   name: '宋体',      value: 'serif', isBuiltin: true,
                  gfont: 'Noto+Serif+SC:wght@400', gname: 'Noto Serif SC' },
                { id: 'fangsong', name: '细衬线',    value: 'serif', isBuiltin: true,
                  gfont: 'Noto+Serif+SC:wght@200', gname: 'Noto Serif SC' },
                { id: 'mono',     name: '等宽字体',  value: 'monospace', isBuiltin: true,
                  gfont: 'Noto+Sans+Mono', gname: 'Noto Sans Mono' }
            ];
            // 内置头像框主列表（始终保持最新）
            const BUILTIN_FRAMES = [
                { id: 'none',   name: '无框',     type: 'builtin', value: 'none',   isBuiltin: true },
                { id: 'st',     name: '星落',     type: 'builtin', value: 'st',     isBuiltin: true },
                { id: 'circle', name: '极简圆圈', type: 'builtin', value: 'circle', isBuiltin: true }
            ];

            // 迁移：清除旧版遗留的内置字体残留（老id如 serif、mono 等旧条目），保留用户自定义
            const BUILTIN_IDS = BUILTIN_FONTS.map(f => f.id);
            // 旧版内置id列表（需要清除）
            const OLD_BUILTIN_IDS = ['serif', 'system', 'msyh', 'heiti', 'pingfang', 'kaiti', 'songti', 'fangsong', 'mono'];
            if (!state.settings.fontPresets) state.settings.fontPresets = [];
            // 清除所有旧内置项（isBuiltin:true 或 id 在老列表里），保留用户自定义
            state.settings.fontPresets = state.settings.fontPresets.filter(f => !f.isBuiltin && !OLD_BUILTIN_IDS.includes(f.id));
            // 把最新内置字体插入最前
            state.settings.fontPresets = [...BUILTIN_FONTS, ...state.settings.fontPresets];
            if (!state.settings.currentFont || OLD_BUILTIN_IDS.includes(state.settings.currentFont) && !BUILTIN_IDS.includes(state.settings.currentFont)) {
                state.settings.currentFont = 'system';
            }

            // Google Fonts 改为懒加载：只在切换到对应字体时才请求
            // 启动时不加载任何 Google Fonts，避免国内网络超时拖慢启动
            // 把 gname 注入每个字体的 value（字体值先存着，实际请求延迟）
            BUILTIN_FONTS.forEach(f => {
                if (f.gname) f.value = `"${f.gname}", ${f.value}`;
            });

            // 迁移：合并内置头像框
            if (!state.settings.framePresets) state.settings.framePresets = [];
            BUILTIN_FRAMES.forEach(bf => {
                const idx = state.settings.framePresets.findIndex(f => f.id === bf.id);
                if (idx === -1) {
                    state.settings.framePresets.unshift(bf);
                } else {
                    state.settings.framePresets[idx] = bf;
                }
            });
            if (!state.settings.currentFrame) state.settings.currentFrame = state.settings.frameStyle || 'st';
            applySettings();
            renderList();
            renderTags();
            renderHistoryAvatars();
            renderHistoryBgs();
            renderFontPresets();
            renderFramePresets();
            setInterval(updateLiveTimers, 1000);
            updateClock();
            setInterval(updateClock, 1000);
            initBattery();
            renderSpecialPin();

            // 启动遮罩淡出
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 600);
            }

            // 加载完成后淡出遮罩
            setTimeout(() => {
                const overlay = document.getElementById('launch-overlay');
                if (overlay) {
                    overlay.classList.add('fade-out');
                    setTimeout(() => overlay.remove(), 650);
                }
            }, 600);
        };

        function openSettings() {
            // 设置已整合进抽屉
            openDrawer();
            const s = state.settings;
            const elTodo = document.getElementById('sb-show-todo');
            const elSpecial = document.getElementById('sb-show-special');
            if (elTodo) elTodo.checked = s.sbShowTodo !== false;
            if (elSpecial) elSpecial.checked = s.sbShowSpecial !== false;
        }

        // 特殊日弹窗（独立 modal）
        function openSpecialModal() {
            renderSpecialDays();
            openModal('special-modal');
        }

        function updateSbSettings() {
            const elTodo = document.getElementById('sb-show-todo');
            const elSpecial = document.getElementById('sb-show-special');
            state.settings.sbShowTodo = elTodo ? elTodo.checked : true;
            state.settings.sbShowSpecial = elSpecial ? elSpecial.checked : true;
            saveData();
        }

        function openEditor(id = null) {
            state.editingId = id;
            const title = document.getElementById('editor-title');
            const contentInput = document.getElementById('edit-content');
            const tagsInput = document.getElementById('edit-tags');
            const timerInput = document.getElementById('edit-timer');

            if (id) {
                const note = state.notes.find(n => n.id === id);
                title.innerText = "编辑内容";
                contentInput.value = note.content;
                tagsInput.value = note.tags.join(' ');

                if (note.destructTime) {
                    const remainingMs = note.destructTime - Date.now();
                    timerInput.value = remainingMs > 0 ? Math.ceil(remainingMs / 60000) : 0;
                } else {
                    timerInput.value = 0;
                }
                state.tempImages = [...note.images];
            } else {
                title.innerText = "言って。";
                contentInput.value = '';
                // 若当前选中了某个非"全部"的tag，自动带入
                tagsInput.value = (state.filterTag && !state.blockedTags.includes(state.filterTag)) ? state.filterTag : '';
                // ⏳tag下默认3分钟倒计时
                timerInput.value = (state.filterTag === '⏳') ? '3' : '0';
                state.tempImages = [];
            }

            // Todo 模式初始化：新建时跟随当前模式，编辑时跟随笔记本身
            const isTodo = id
                ? !!((state.notes.find(n => n.id === id) || {}).isTodo)
                : (_currentMode === 'todo');
            _todoMode = isTodo;
            _todoItems = id && isTodo ? [...(state.notes.find(n => n.id === id).todoItems || [])] : [];
            applyTodoModeUI();

            // 笔记模式下隐藏待办切换按钮
            const todoModeBtn = document.getElementById('todo-mode-btn');
            if (todoModeBtn) todoModeBtn.style.display = _currentMode === 'note' ? 'none' : '';

            renderTempImages();
            openModal('editor-modal');
        }

        function renderTempImages() {
            const area = document.getElementById('image-preview-area');
            area.innerHTML = '';
            state.tempImages.forEach((img, idx) => {
                const el = document.createElement('img');
                el.src = img.src;
                el.style.width = '50px'; el.style.height = '50px'; el.style.objectFit = 'cover';
                area.appendChild(el);
            });
        }

        function saveItem() {
            const content = document.getElementById('edit-content').value;
            const tagsInput = document.getElementById('edit-tags').value;
            const timerVal = parseInt(document.getElementById('edit-timer').value);

            if (!content && state.tempImages.length === 0 && !(_todoMode && _todoItems.length > 0)) return;

            let tags = tagsInput.split(' ').filter(t => t.trim() !== '');
            const destructTime = timerVal > 0 ? Date.now() + timerVal * 60 * 1000 : null;

            // 有倒计时自动加⏳tag
            if (destructTime && !tags.includes('⏳')) tags.push('⏳');
            // 没有倒计时则移除⏳tag
            if (!destructTime) tags = tags.filter(t => t !== '⏳');

            if (state.editingId) {
                const note = state.notes.find(n => n.id === state.editingId);
                note.content = content;
                note.tags = tags;
                note.images = state.tempImages;
                note.destructTime = destructTime;
                note.isTodo = _todoMode;
                note.todoItems = _todoMode ? [..._todoItems] : [];
            } else {
                state.notes.unshift({
                    id: Date.now(),
                    content: _todoMode ? '' : content,
                    tags: tags,
                    images: state.tempImages,
                    timestamp: new Date().toLocaleString(),
                    createdTime: Date.now(),
                    destructTime: destructTime,
                    isTrash: false,
                    isTodo: _todoMode,
                    todoItems: _todoMode ? [..._todoItems] : []
                });
            }

            saveData(); closeModal('editor-modal'); renderList(); renderTags();
        }

        function deleteNote(id) {
            // 找到要删的笔记，记录它的tag
            const note = state.notes.find(n => n.id === id);
            const tagsToCheck = note ? [...note.tags] : [];
            state.notes = state.notes.filter(n => n.id !== id);
            // 检查这些tag在其他笔记里是否还存在，不存在则清理
            tagsToCheck.forEach(tag => {
                const stillExists = state.notes.some(n => n.tags.includes(tag));
                if (!stillExists) {
                    state.blockedTags = state.blockedTags.filter(t => t !== tag);
                    if (state.filterTag === tag) state.filterTag = null;
                }
            });
            saveData(); renderList(); renderTags();
        }

        function togglePin(id) {
            const note = state.notes.find(n => n.id === id);
            if (!note) return;
            note.isPinned = !note.isPinned;
            saveData(); renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            const now = Date.now();

            let filtered = state.notes.filter(item => {
                if (item.isTrash) return false;
                if (item.destructTime && now >= item.destructTime) return false;

                if (item.tags.some(t => state.blockedTags.includes(t))) return false;
                if (state.filterTag) {
                    // filterTagIsParent=true时匹配所有"父/"开头的子tag，也匹配父tag本身
                    if (state.filterTagIsParent) {
                        const prefix = state.filterTag + '/';
                        const match = item.tags.some(t => t === state.filterTag || t.startsWith(prefix));
                        if (!match) return false;
                    } else {
                        if (!item.tags.includes(state.filterTag)) return false;
                    }
                }
                if (state.filterDateFrom || state.filterDateTo) {
                    const itemDate = new Date(item.timestamp);
                    const iy = itemDate.getFullYear();
                    const im = itemDate.getMonth() + 1;
                    const id = itemDate.getDate();
                    // 把key解析成年月日数字直接比较，绕过时区格式问题
                    const toYMD = key => {
                        if (!key) return null;
                        const p = key.trim().split(/\s+/);
                        if (p.length < 3) return null;
                        return { y: parseInt(p[0]), m: parseInt(p[1]), d: parseInt(p[2]) };
                    };
                    const cmp = (a, b) => {
                        if (a.y !== b.y) return a.y - b.y;
                        if (a.m !== b.m) return a.m - b.m;
                        return a.d - b.d;
                    };
                    const item_ymd = { y: iy, m: im, d: id };
                    if (state.filterDateFrom) {
                        const from = toYMD(state.filterDateFrom);
                        if (from && cmp(item_ymd, from) < 0) return false;
                    }
                    if (state.filterDateTo) {
                        const to = toYMD(state.filterDateTo);
                        if (to && cmp(item_ymd, to) > 0) return false;
                    }
                }
                if (state.searchQuery) {
                    const inContent = item.content.includes(state.searchQuery);
                    const inRemark = item.images.some(img => img.remark && img.remark.includes(state.searchQuery));
                    const inComments = (item.comments || []).some(c => c.text && c.text.includes(state.searchQuery));
                    if (!inContent && !inRemark && !inComments) return false;
                }
                return true;
            });

            // 模式过滤
            const mode = (typeof _currentMode !== 'undefined') ? _currentMode : 'note';
            if (mode === 'note') {
                filtered = filtered.filter(item => !item.isTodo);
            } else if (mode === 'todo') {
                filtered = filtered.filter(item => item.isTodo);
            }
            // pomodoro 模式显示全部，不过滤

            // 置顶排前面，其余保持原顺序
            filtered.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

            filtered.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'note-wrapper';

                const deleteBg = document.createElement('div');
                deleteBg.className = 'delete-btn-bg';
                deleteBg.innerHTML = '🗑️';
                deleteBg.onclick = () => deleteNote(item.id);

                const pinBg = document.createElement('div');
                pinBg.className = 'pin-btn-bg';
                pinBg.innerHTML = item.isPinned ? '📌' : '📍';
                pinBg.onclick = () => togglePin(item.id);

                const card = document.createElement('div');
                card.className = 'note-card' + (item.isPinned ? ' is-pinned' : '');

                let startX = 0, startY = 0, currentX = 0;
                let isSwiping = false, isHorizontal = null;

                card.addEventListener('touchstart', e => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isSwiping = false;
                    isHorizontal = null;
                    card.style.transition = 'none';
                });
                card.addEventListener('touchmove', e => {
                    currentX = e.touches[0].clientX;
                    const currentY = e.touches[0].clientY;
                    const diffX = currentX - startX;
                    const diffY = currentY - startY;

                    // 第一次判断方向，锁定后不再变
                    if (isHorizontal === null && (Math.abs(diffX) > 6 || Math.abs(diffY) > 6)) {
                        isHorizontal = Math.abs(diffX) > Math.abs(diffY) * 1.5;
                    }
                    if (!isHorizontal) return; // 纵向直接放行

                    if (Math.abs(diffX) > 10) isSwiping = true;
                    e.preventDefault();
                    if (diffX < 0) {
                        card.style.transform = `translateX(${Math.max(diffX, -80)}px)`;
                        card.style.background = 'rgba(255, 255, 255, 0.35)';
                        deleteBg.style.opacity = '0.5';
                        pinBg.style.opacity = '0';
                    } else if (diffX > 0) {
                        card.style.transform = `translateX(${Math.min(diffX, 80)}px)`;
                        pinBg.style.opacity = String(Math.min(diffX / 60, 1));
                        deleteBg.style.opacity = '0';
                    }
                }, {passive: false});
                card.addEventListener('touchend', e => {
                    card.style.transition = 'transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease';
                    let diff = currentX ? currentX - startX : 0;
                    if (isHorizontal && diff < -60) {
                        card.style.transform = `translateX(-80px)`;
                        deleteBg.style.opacity = '0.5';
                    } else if (isHorizontal && diff > 60) {
                        togglePin(item.id);
                        card.style.transform = `translateX(0px)`;
                        pinBg.style.opacity = '0';
                    } else {
                        card.style.transform = `translateX(0px)`;
                        card.style.background = '';
                        deleteBg.style.opacity = '0';
                        pinBg.style.opacity = '0';
                    }
                    startX = 0; startY = 0; currentX = 0; isHorizontal = null;
                });

                card.onclick = (e) => {
                    if (isSwiping) return;
                    if (e.target.closest('.edit-btn') || e.target.closest('.note-thumb')) return;
                    setTimeout(() => openFullNote(item.id), 150);
                };

                let imagesHtml = '';
                if (item.images && item.images.length > 0) {
                    imagesHtml = `<div class="note-images">
                        ${item.images.map((img, idx) => `<img src="${img.src}" class="note-thumb" onclick="openImageRemark(${item.id}, ${idx})">`).join('')}
                    </div>`;
                }
                let tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                let timerHtml = item.destructTime ? `<span class="live-timer" data-time="${item.destructTime}"></span>` : '';
                const pinIcon = item.isPinned ? `<span style="font-size:0.8rem; opacity:0.6; margin-right:2px;" title="已置顶">📌</span>` : '';
                const comments = item.comments || [];
                const cpEnabled = state.commentPreviewEnabled !== false;
                const cpName = state.commentPreviewName || '';
                const cpSuffix = state.commentPreviewSuffix !== undefined ? state.commentPreviewSuffix : '说：';
                const commentPreviewHtml = (cpEnabled && comments.length > 0) ? `
                    <div style="margin-top:8px; display:flex; flex-direction:column; gap:3px;">
                        ${comments.map(c => `
                            <div style="display:flex; align-items:center; gap:4px;">
                                <span style="font-size:0.78rem; color:var(--text-color); opacity:0.87; flex-shrink:0;">▷  </span>
                                <span style="font-size:0.78rem; color:var(--text-color); opacity:0.87; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1;">${cpName}${cpSuffix}${c.text}</span>
                            </div>
                        `).join('')}
                    </div>
                ` : '';

                // 笔记当天的纪念日
                const itemDate = new Date(item.timestamp); itemDate.setHours(0,0,0,0);
                const itemSpecials = (state.specialDays || []).filter(sd => {
                    let target = new Date(sd.date); target.setHours(0,0,0,0);
                    if (sd.annual) target.setFullYear(itemDate.getFullYear());
                    return target.getTime() === itemDate.getTime();
                });
                const specialNoteHtml = itemSpecials.length > 0 ? `
                    <div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; justify-content:flex-end;">
                        ${itemSpecials.map(sd => `<span style="font-size:0.72rem; color:var(--accent-color); opacity:0.85;">${sd.emoji ? sd.emoji + ' ' : '✦ '}${sd.name}</span>`).join('')}
                    </div>` : '';

                // Todo 渲染
                let todoHtml = '';
                if (item.isTodo && item.todoItems && item.todoItems.length > 0) {
                    const doneCount = item.todoItems.filter(t => t.done).length;
                    todoHtml = `<div style="margin-top:6px;">
                        <div style="font-size:0.7rem; color:#aaa; margin-bottom:5px;">☑ ${doneCount}/${item.todoItems.length}</div>
                        ${item.todoItems.map((t, idx) => `
                        <div style="display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer;" onclick="event.stopPropagation(); toggleTodoDone(${item.id}, ${idx})">
                            <span style="font-size:1rem; flex-shrink:0; color:${t.done ? 'var(--accent-color)' : '#ccc'};">${t.done ? '☑' : '☐'}</span>
                            <span style="font-size:0.85rem; line-height:1.4; color:var(--text-color); ${t.done ? 'text-decoration:line-through; opacity:0.5;' : ''}">${t.text}</span>
                        </div>`).join('')}
                    </div>`;
                }

                card.innerHTML = `
                    <div class="note-header">
                        <span class="note-time">${pinIcon}${item.timestamp}</span>
                        <div class="note-actions">
                            ${timerHtml}
                            <span class="edit-btn" onclick="openEditor(${item.id})">📝</span>
                        </div>
                    </div>
                    ${item.isTodo ? todoHtml : `<div class="note-content">${item.content}</div>`}
                    ${imagesHtml}
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                        <div class="note-tags">${tagsHtml}</div>
                    </div>
                    ${commentPreviewHtml}
                    ${specialNoteHtml}
                `;

                wrapper.appendChild(pinBg);
                wrapper.appendChild(deleteBg);
                wrapper.appendChild(card);
                container.appendChild(wrapper);
            });
            updateLiveTimers();
        }

        let _currentNoteId = null;

        function openFullNote(id) {
            const note = state.notes.find(n => n.id === id);
            if(!note) return;
            _currentNoteId = id;

            let imagesHtml = '';
            if (note.images && note.images.length > 0) {
                imagesHtml = `<div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                    ${note.images.map(img => `
                        <div>
                            <img src="${img.src}" style="width:100%; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                            ${img.remark ? `<div style="font-size:0.85rem; color:#555; margin-top:5px; font-style:italic;">${img.remark}</div>` : ''}
                        </div>
                    `).join('')}
                </div>`;
            }
            let tagsHtml = note.tags.map(t => `<span class="tag" style="background:rgba(255,255,255,0.6); border:1px solid #eee;">#${t}</span>`).join('');

            // Todo 正文或普通正文
            let bodyContentHtml = '';
            if (note.isTodo && note.todoItems && note.todoItems.length > 0) {
                const doneCount = note.todoItems.filter(t => t.done).length;
                bodyContentHtml = `
                    <div style="margin-bottom:4px; font-size:0.75rem; color:#aaa;">☑ ${doneCount} / ${note.todoItems.length}</div>
                    <div id="full-note-todo-list" style="display:flex; flex-direction:column; gap:2px;">
                        ${note.todoItems.map((t, idx) => `
                        <div onclick="toggleTodoDoneFromFull(${note.id}, ${idx})" style="display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; transition:background 0.15s; background:${t.done ? 'rgba(0,0,0,0.02)' : 'transparent'};">
                            <span style="font-size:1.2rem; flex-shrink:0; margin-top:1px; color:${t.done ? 'var(--accent-color)' : 'rgba(0,0,0,0.2)'};">${t.done ? '☑' : '☐'}</span>
                            <span style="font-size:1rem; line-height:1.55; color:var(--text-color); ${t.done ? 'text-decoration:line-through; opacity:0.45;' : ''}">${t.text}</span>
                        </div>`).join('')}
                    </div>`;
            } else {
                bodyContentHtml = `<div style="font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; color:var(--text-color);">${note.content}</div>`;
            }

            document.getElementById('full-note-body').innerHTML = `
                <div style="display: flex; align-items: center; margin-bottom: 15px;">
                    <img src="${state.settings.currentAvatar}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <span style="font-weight: bold; font-size: 1.1rem; ${(()=>{ const nc = state.settings.nameColor||'#333'; return nc.includes('gradient') ? `background:${nc};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;` : `color:${nc};`; })()}">${state.settings.name}</span>
                </div>
                ${bodyContentHtml}
                ${imagesHtml}
                <div style="margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap;">${tagsHtml}</div>
                <div style="font-size: 0.8rem; color: #999; text-align: right; margin-top: 12px; font-style: italic;">${note.timestamp}</div>
                <div style="border-top: 1px solid rgba(0,0,0,0.09); margin: 16px 0 0;"></div>
                <div id="full-note-comments"></div>
            `;
            renderComments(note);
            document.getElementById('comment-input').value = '';
            document.getElementById('comment-input').style.height = 'auto';
            openModal('full-note-modal');
        }

        function renderComments(note) {
            const container = document.getElementById('full-note-comments');
            if (!container) return;
            const comments = note.comments || [];
            if (comments.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#ccc; font-size:0.8rem; padding:14px 0 6px;">还没有追评</div>';
                return;
            }
            container.innerHTML = comments.map((c, i) => `
                <div class="comment-item" data-note-id="${note.id}" data-idx="${i}" style="position:relative; overflow:hidden; border-radius:8px; margin-bottom:2px;">
                    <div class="comment-delete-bg" style="position:absolute; top:0; right:0; bottom:0; width:60px; background:transparent; display:flex; align-items:center; justify-content:center; font-size:1.4rem; cursor:pointer; opacity:0; transition:opacity 0.3s;" onclick="deleteComment(${note.id},${i})">🗑️</div>
                    <div class="comment-inner" style="display:flex; align-items:flex-start; gap:8px; padding:10px 4px; background:transparent; position:relative; z-index:2; transition:transform 0.3s ease; will-change:transform;">
                        <img src="${state.settings.currentAvatar}" style="width:26px; height:26px; border-radius:50%; object-fit:cover; flex-shrink:0; margin-top:2px;">
                        <div style="flex:1;">
                            <div style="font-size:0.78rem; color:#bbb; margin-bottom:3px;">${c.time}</div>
                            <div style="font-size:0.9rem; line-height:1.5; color:var(--text-color); white-space:pre-wrap;">${c.text}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            // 绑定左滑手势
            container.querySelectorAll('.comment-item').forEach(item => {
                const inner = item.querySelector('.comment-inner');
                const delBg = item.querySelector('.comment-delete-bg');
                let startX = 0, curX = 0, swiping = false, locked = false;

                inner.addEventListener('touchstart', e => {
                    startX = e.touches[0].clientX;
                    swiping = false;
                    inner.style.transition = 'none';
                }, {passive:true});

                inner.addEventListener('touchmove', e => {
                    curX = e.touches[0].clientX;
                    const diff = curX - startX;
                    if (Math.abs(diff) > 15) swiping = true;
                    if (diff < -15) {
                        inner.style.transform = `translateX(${Math.max(diff, -60)}px)`;
                        delBg.style.opacity = '0.7';
                    }
                }, {passive:true});

                inner.addEventListener('touchend', () => {
                    inner.style.transition = 'transform 0.3s ease';
                    const diff = curX - startX;
                    if (diff < -45) {
                        // 滑到底：锁定在-60px，等待点垃圾桶
                        inner.style.transform = 'translateX(-60px)';
                        delBg.style.opacity = '0.7';
                        locked = true;
                    } else {
                        // 没滑够：弹回
                        inner.style.transform = 'translateX(0)';
                        delBg.style.opacity = '0';
                        locked = false;
                    }
                    startX = 0; curX = 0;
                });

                // 点内容区域时如果已锁定则收回，不触发打开评论
                inner.addEventListener('click', () => {
                    if (locked) {
                        inner.style.transition = 'transform 0.3s ease';
                        inner.style.transform = 'translateX(0)';
                        delBg.style.opacity = '0';
                        locked = false;
                    }
                });
            });
        }

        function submitComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || _currentNoteId === null) return;
            const note = state.notes.find(n => n.id === _currentNoteId);
            if (!note) return;
            if (!note.comments) note.comments = [];
            note.comments.push({
                text,
                time: new Date().toLocaleString()
            });
            input.value = '';
            saveData();
            renderList();
            renderComments(note);
            // 滚到评论底部
            setTimeout(() => {
                const c = document.getElementById('full-note-comments');
                c.scrollTop = c.scrollHeight;
            }, 50);
        }

        function deleteComment(noteId, idx) {
            const note = state.notes.find(n => n.id === noteId);
            if (!note || !note.comments) return;
            note.comments.splice(idx, 1);
            saveData();
            renderList();
            renderComments(note);
        }

        function updateLiveTimers() {
            const now = Date.now();
            let needsRender = false;
            document.querySelectorAll('.live-timer').forEach(el => {
                const destructTime = parseInt(el.getAttribute('data-time'));
                const diff = destructTime - now;
                if (diff <= 0) {
                    needsRender = true;
                } else {
                    const mins = Math.floor(diff / 60000);
                    const secs = Math.floor((diff % 60000) / 1000);
                    el.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                }
            });
            if (needsRender) {
                // 找出即将被删除的笔记，收集tag
                const expiredTags = [];
                state.notes.forEach(n => {
                    if (n.destructTime && now >= n.destructTime) {
                        expiredTags.push(...n.tags);
                    }
                });
                // 先删笔记
                state.notes = state.notes.filter(n => !(n.destructTime && now >= n.destructTime));
                // 检查孤立tag
                expiredTags.forEach(tag => {
                    const stillExists = state.notes.some(n => n.tags.includes(tag));
                    if (!stillExists) {
                        state.blockedTags = state.blockedTags.filter(t => t !== tag);
                        if (state.filterTag === tag) state.filterTag = null;
                    }
                });
                saveData();
                renderList();
                renderTags();
            }
        }

        function handleImageUpload(input) {
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.tempImages.push({ src: e.target.result, remark: '' });
                    renderTempImages();
                };
                reader.readAsDataURL(file);
            });
        }

        let currentEditingImg = null;
        function openImageRemark(noteId, imgIndex) {
            const note = state.notes.find(n => n.id === noteId);
            currentEditingImg = { noteId, imgIndex };
            document.getElementById('remark-target-img').src = note.images[imgIndex].src;
            document.getElementById('img-remark-text').value = note.images[imgIndex].remark || '';
            openModal('img-remark-modal');
        }
        function saveImageRemark() {
            const note = state.notes.find(n => n.id === currentEditingImg.noteId);
            note.images[currentEditingImg.imgIndex].remark = document.getElementById('img-remark-text').value;
            saveData(); closeModal('img-remark-modal');
        }

        function applySettings() {
            const s = state.settings;
            document.documentElement.style.setProperty('--accent-color', s.themeColor);

            // accent-color 文字可读性：用感知亮度公式判断白字还是黑字
            // 感知亮度 = 0.299R + 0.587G + 0.114B（人眼对绿色最敏感）
            const hex = s.themeColor.replace('#', '');
            const r = parseInt(hex.substring(0,2), 16);
            const g = parseInt(hex.substring(2,4), 16);
            const b = parseInt(hex.substring(4,6), 16);
            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
            // 亮度 > 186（约73%）时背景太亮，换黑字；否则白字
            document.documentElement.style.setProperty('--accent-text', luminance > 186 ? '#222' : '#fff');

            // 日历范围色跟着 accent-color 走，低饱和处理
            // 把 accent-color 混入灰色降饱和，透明度控制
            document.documentElement.style.setProperty('--cal-range-bg', `rgba(${r},${g},${b},0.18)`);
            document.documentElement.style.setProperty('--cal-dot-bg', `rgba(${r},${g},${b},0.6)`);
            // 感知亮度高则用深色文字，低则用浅色文字
            document.documentElement.style.setProperty('--cal-text-on-range', luminance > 160 ? '#222' : '#fff');

            // 名字颜色（支持CSS任意值：纯色/渐变）
            const nameColor = s.nameColor || '#333333';
            // 渐变需要用 background-clip 实现，纯色直接 color
            const nameEl = document.getElementById('display-name');
            if (nameEl) {
                const isGradient = nameColor.includes('gradient');
                if (isGradient) {
                    nameEl.style.backgroundImage = nameColor;
                    nameEl.style.webkitBackgroundClip = 'text';
                    nameEl.style.webkitTextFillColor = 'transparent';
                    nameEl.style.backgroundClip = 'text';
                    document.documentElement.style.setProperty('--name-color', 'transparent');
                } else {
                    nameEl.style.backgroundImage = '';
                    nameEl.style.webkitBackgroundClip = '';
                    nameEl.style.webkitTextFillColor = '';
                    nameEl.style.backgroundClip = '';
                    document.documentElement.style.setProperty('--name-color', nameColor);
                }
            }
            // 预览框
            const namePreview = document.getElementById('name-color-preview');
            if (namePreview) namePreview.style.background = nameColor;

            // 全局字体颜色
            const tr = s.textColorR ?? 51, tg = s.textColorG ?? 51, tb = s.textColorB ?? 51;
            document.documentElement.style.setProperty('--text-color', `rgb(${tr},${tg},${tb})`);
            const tcPreview = document.getElementById('text-color-preview');
            const tcHexEl = document.getElementById('text-color-hex');
            const hexVal = rgbToHex(tr, tg, tb);
            if (tcPreview) tcPreview.style.background = hexVal;
            if (tcHexEl) tcHexEl.innerText = hexVal;
            syncRgbSliders(tr, tg, tb);

            // 背景：优先用当前模式专属背景，回退到全局背景
            const modeKey = { note: 'bgNote', todo: 'bgTodo', pomodoro: 'bgPomodoro' };
            const activeBg = s[modeKey[_currentMode] || 'bgNote'] || s.bgImage || '';
            document.documentElement.style.setProperty('--bg-image', activeBg ? `url(${activeBg})` : 'none');

            // 应用字体
            const activeFont = (s.fontPresets || []).find(f => f.id === s.currentFont);
            if (activeFont) {
                if (activeFont.dataUrl) {
                    // 自定义上传字体：动态注册 @font-face
                    const faceId = 'custom_font_' + activeFont.id;
                    if (!document.getElementById(faceId)) {
                        const style = document.createElement('style');
                        style.id = faceId;

                const cur = (document.getElementById('setting-name-color').value || '').trim();

                if (rgb) {

        function parseCssColorToRgb(str) {
            // 支持 #rgb #rrggbb rgb(r,g,b)
            if (!str) return null;
            let m = str.match(/^#([0-9a-f]{6})$/i);
            if (m) { const h=m[1]; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
            m = str.match(/^#([0-9a-f]{3})$/i);
            if (m) { const h=m[1]; return [parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)]; }
            m = str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
            if (m) return [parseInt(m[1]),parseInt(m[2]),parseInt(m[3])];
            return null;
        }

        function renderTags() {
            const allTags = new Set(); state.notes.forEach(n => n.tags.forEach(t => allTags.add(t)));
            const container = document.getElementById('tag-filters');
            container.innerHTML = '';

            // 解析父子结构
            const parentMap = {}; // { parentName: [fullChildTag, ...] }
            const childSet = new Set();
            allTags.forEach(tag => {
                if (tag.includes('/')) {
                    const slash = tag.indexOf('/');
                    const parent = tag.slice(0, slash);
                    if (!parentMap[parent]) parentMap[parent] = [];
                    parentMap[parent].push(tag);
                    childSet.add(tag);
                }
            });

            if (!state._expandedParentTags) state._expandedParentTags = new Set();

            // 「全部」
            const allDiv = document.createElement('div');
            allDiv.className = `filter-tag ${!state.filterTag ? 'active' : ''}`;
            allDiv.innerText = '全部';
            allDiv.onclick = () => filterByTag(null);
            setupLongPress(allDiv, () => openTagManager());
            container.appendChild(allDiv);

            // 「⏳」
            const timerDiv = document.createElement('div');
            timerDiv.className = `filter-tag ${state.filterTag === '⏳' && !state.filterTagIsParent ? 'active' : ''}`;
            timerDiv.innerText = '⏳';
            timerDiv.onclick = () => filterByTag('⏳');
            setupLongPress(timerDiv, () => toggleBlockTag('⏳'));
            container.appendChild(timerDiv);
            allTags.delete('⏳');

            allTags.forEach(tag => {
                if (childSet.has(tag)) return;

                const isBlocked = state.blockedTags.includes(tag);
                const hasChildren = !!parentMap[tag];
                const isExpanded = hasChildren && state._expandedParentTags.has(tag);
                const isActive = hasChildren
                    ? (state.filterTag === tag && state.filterTagIsParent)
                    : (state.filterTag === tag && !state.filterTagIsParent);

                const div = document.createElement('div');
                div.className = `filter-tag ${isActive ? 'active' : ''} ${isBlocked ? 'blocked' : ''}`;
                div.style.cssText = 'display:flex; align-items:center; gap:2px;';

                if (hasChildren) {
                    div.innerHTML = `<span>${tag}</span><span style="font-size:0.6rem; opacity:0.55;">${isExpanded ? ' ▴' : ' ▾'}</span>`;
                    div.onclick = () => {
                        if (isBlocked) return;
                        if (isExpanded) {
                            // 已展开 → 单击筛选父+子
                            filterByTag(tag, true);
                        } else {
                            // 未展开 → 展开
                            state._expandedParentTags.add(tag);
                            renderTags();
                        }
                    };
                    setupLongPress(div, () => toggleBlockTag(tag));
                } else {
                    div.innerText = tag;
                    div.onclick = () => filterByTag(tag, false);
                    setupLongPress(div, () => toggleBlockTag(tag));
                }
                container.appendChild(div);

                // 展开时渲染子tag
                if (isExpanded) {
                    parentMap[tag].forEach(childTag => {
                        const isChildBlocked = state.blockedTags.includes(childTag);
                        const isChildActive = state.filterTag === childTag && !state.filterTagIsParent;
                        const childLabel = childTag.slice(childTag.indexOf('/') + 1);
                        const childDiv = document.createElement('div');
                        childDiv.className = `filter-tag ${isChildActive ? 'active' : ''} ${isChildBlocked ? 'blocked' : ''}`;
                        childDiv.style.cssText = 'font-size:0.78rem; padding-left:10px; border-left:2px solid var(--accent-color);';
                        childDiv.innerText = childLabel;
                        childDiv.onclick = () => filterByTag(childTag, false);
                        setupLongPress(childDiv, () => toggleBlockTag(childTag));
                        container.appendChild(childDiv);
                    });
                }
            });
        }

        function renderTodoEditorItems() {
            const list = document.getElementById('todo-items-list');
            list.innerHTML = '';
            _todoItems.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'todo-editor-row';

                    <textarea rows="1" data-idx="${idx}"
                        style="flex:1; border:none; background:transparent; outline:none; font-size:0.95rem; padding:0; margin:0; color:var(--text-color); resize:none; overflow:hidden; line-height:1.5; font-family:var(--custom-font); ${item.done ? 'text-decoration:line-through; opacity:0.5;' : ''}"
                        placeholder="待办内容..."
                        oninput="syncTodoText(${idx}, this)"
                        onkeydown="handleTodoKey(event, ${idx})"
                    >${item.text}</textarea>
                    <span onclick="removeTodoItem(${idx})" style="color:#ccc; cursor:pointer; font-size:1.1rem; flex-shrink:0; margin-top:2px; line-height:1.4;">×</span>
                `;
                list.appendChild(row);
            });
            // 自动撑高所有textarea
            list.querySelectorAll('textarea').forEach(ta => {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });

        function syncTodoText(idx, ta) {
            _todoItems[idx].text = ta.value;
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
        }

        function handleTodoKey(e, idx) {
            if (e.key === 'Enter') {
                e.preventDefault();
                // 在当前idx后插入新项
                _todoItems.splice(idx + 1, 0, { text: '', done: false });
                renderTodoEditorItems();
                setTimeout(() => {
                    const tas = document.querySelectorAll('#todo-items-list textarea');
                    if (tas[idx + 1]) tas[idx + 1].focus();
                }, 30);
            } else if (e.key === 'Backspace') {
                const ta = e.target;
                if (ta.value === '' && _todoItems.length > 1) {
                    e.preventDefault();
                    _todoItems.splice(idx, 1);
                    renderTodoEditorItems();
                    setTimeout(() => {
                        const tas = document.querySelectorAll('#todo-items-list textarea');
                        const focusIdx = Math.max(0, idx - 1);
                        if (tas[focusIdx]) {
                            tas[focusIdx].focus();
                            // 光标移到末尾
                            const len = tas[focusIdx].value.length;
                            tas[focusIdx].setSelectionRange(len, len);
                        }
                    }, 30);
                }
            }
        }

        function addTodoItem() {
            _todoItems.push({ text: '', done: false });
            renderTodoEditorItems();
            setTimeout(() => {
                const tas = document.querySelectorAll('#todo-items-list textarea');
                if (tas.length) tas[tas.length - 1].focus();
            }, 30);
        }

        function removeTodoItem(idx) {
            _todoItems.splice(idx, 1);
            renderTodoEditorItems();

        function calcDays(dateStr, annual) {
            const today = new Date(); today.setHours(0,0,0,0);
            let target = new Date(dateStr); target.setHours(0,0,0,0);
            if (annual) {
                // 今年的日期
                target.setFullYear(today.getFullYear());
                if (target < today) target.setFullYear(today.getFullYear() + 1);
            }
            const diff = Math.round((target - today) / 86400000);
            return diff;
        }

        function formatDays(diff, dateStr, annual) {
            const past = new Date(dateStr) < new Date() && !annual;
            if (diff === 0) return { num: '今天', sub: '' };
            if (diff > 0) return { num: `还有 ${diff}`, sub: '天' };
            // 过去的日期（非每年重复）
            const total = Math.abs(Math.round((new Date() - new Date(dateStr)) / 86400000));
            return { num: `已 ${total}`, sub: '天' };
        }

                return;

            list.innerHTML = days.map((d, i) => {
                const diff = calcDays(d.date, d.annual);
                const fmt = formatDays(diff, d.date, d.annual);
                const isPinned = state.specialPinnedId === d.id;
                return `
                <div class="special-item ${isPinned ? 'pinned' : ''}" onclick="toggleSpecialPin(${i})">
                    <div class="special-item-info">

                    <div class="special-item-days">

                    </div>
                    <button onclick="event.stopPropagation();deleteSpecialDay(${i})" style="background:none;border:none;color:#ddd;font-size:1rem;cursor:pointer;padding:0 0 0 6px;">×</button>

        // ===================== 日历 =====================
        let _calYear = new Date().getFullYear();
        let _calMonth = new Date().getMonth();

        let _calPickStep = 0;

        // 日历月份切换
        function calChangeMonth(dir) {
            _calMonth += dir;

            if (_calMonth < 0) { _calMonth = 11; _calYear--; }
            renderCalendar();

        function dateToKey(y, m, d) {
            return `${y} ${m} ${d}`;
        }
        function parseSpaceDate(str) {
            if (!str) return null;
            const parts = str.trim().split(/\s+/);
            if (parts.length < 3) return null;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return isNaN(d) ? null : d;
        }
        function keyToDate(key) {
            if (!key) return null;
            return parseSpaceDate(key);
        }

        function renderCalendar() {
            const label = document.getElementById('cal-month-label');
            const grid = document.getElementById('cal-grid');
            label.innerText = `${_calYear}年 ${_calMonth + 1}月`;

            const noteDates = new Set();
            state.notes.forEach(n => {
                const d = new Date(n.timestamp);
                if (!isNaN(d)) noteDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
            });

            // 纪念日日期集合
            const specialDateKeys = new Set();
            (state.specialDays || []).forEach(sd => {
                let target = new Date(sd.date); target.setHours(0,0,0,0);
                if (sd.annual) target.setFullYear(_calYear);
                specialDateKeys.add(`${target.getFullYear()}-${target.getMonth()}-${target.getDate()}`);
            });

            const today = new Date(); today.setHours(0,0,0,0);
            const firstDay = new Date(_calYear, _calMonth, 1);
            const lastDay = new Date(_calYear, _calMonth + 1, 0);
            const startDow = firstDay.getDay();

            // 用年月日数字比较，避免时区格式问题
            const parseKeyYMD = key => {
                if (!key) return null;
                const p = key.trim().split(/\s+/);
                if (p.length < 3) return null;
                return { y: parseInt(p[0]), m: parseInt(p[1]), d: parseInt(p[2]) };
            };
            const fromYMD = parseKeyYMD(state.filterDateFrom);
            const toYMD = parseKeyYMD(state.filterDateTo);

            grid.innerHTML = '';
            ['日','一','二','三','四','五','六'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-weekday'; el.innerText = d;
                grid.appendChild(el);
            });

            for (let i = 0; i < startDow; i++) {
                const el = document.createElement('div'); el.className = 'cal-cell other-month';
                const prevDate = new Date(_calYear, _calMonth, -startDow + i + 1);
                el.innerText = prevDate.getDate();
                grid.appendChild(el);
            }

            for (let d = 1; d <= lastDay.getDate(); d++) {
                const el = document.createElement('div');
                el.className = 'cal-cell';
                // 数字用span包裹确保在伪元素上层
                const span = document.createElement('span');
                span.style.cssText = 'position:relative;z-index:3;pointer-events:none;';
                span.innerText = d;
                el.appendChild(span);

                const noteKey = `${_calYear}-${_calMonth}-${d}`;
                if (noteDates.has(noteKey)) el.classList.add('has-note');
                if (specialDateKeys.has(noteKey)) {
                    el.classList.add('has-special');
                    const star = document.createElement('span');
                    star.style.cssText = 'position:absolute;top:1px;right:1px;font-size:0.45rem;color:var(--accent-color);z-index:4;line-height:1;pointer-events:none;';
                    star.innerText = '✦';
                    el.appendChild(star);
                }

                const thisDate = new Date(_calYear, _calMonth, d);
                thisDate.setHours(0,0,0,0);

                if (thisDate.getTime() === today.getTime()) el.classList.add('today');

                const cy = _calYear, cm = _calMonth + 1, cd = d;
                if (fromYMD && toYMD) {
                    if (cy===fromYMD.y && cm===fromYMD.m && cd===fromYMD.d) {
                        el.classList.add('range-start');
                    } else if (cy===toYMD.y && cm===toYMD.m && cd===toYMD.d) {
                        el.classList.add('range-end');
                    } else {
                        const after = cy>fromYMD.y || (cy===fromYMD.y && (cm>fromYMD.m || (cm===fromYMD.m && cd>fromYMD.d)));
                        const before = cy<toYMD.y || (cy===toYMD.y && (cm<toYMD.m || (cm===toYMD.m && cd<toYMD.d)));
                        if (after && before) el.classList.add('in-range');
                    }
                } else if (fromYMD) {
                    if (cy===fromYMD.y && cm===fromYMD.m && cd===fromYMD.d) {
                        el.classList.add('selected'); // 单日用 selected，更大更醒目
                    }
                }

                el.onclick = () => calSelectDate(_calYear, _calMonth + 1, d);
                grid.appendChild(el);
            }

            const totalCells = startDow + lastDay.getDate();
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remaining; i++) {
                const el = document.createElement('div'); el.className = 'cal-cell other-month';
                el.innerText = i; grid.appendChild(el);
            }
        }

        let _calLastClick = null;

        function calSelectDate(y, m, d) {
            const key = dateToKey(y, m, d);

            if (_calPickStep === 0 || _calPickStep === 2) {
                state.filterDateFrom = key;
                state.filterDateTo = null;
                _calLastClick = key;
                _calPickStep = 1;
            } else if (_calPickStep === 1) {
                if (key === _calLastClick) {
                    state.filterDateFrom = null;
                    state.filterDateTo = null;
                    _calLastClick = null;
                    _calPickStep = 0;
                } else {
                    const from = keyToDate(state.filterDateFrom);
                    from.setHours(0,0,0,0);
                    const picked = new Date(y, m-1, d);
                    picked.setHours(0,0,0,0);
                    if (picked < from) {
                        state.filterDateTo = state.filterDateFrom;
                        state.filterDateFrom = key;
                    } else {
                        state.filterDateTo = key;
                    }
                    _calLastClick = null;
                    _calPickStep = 2;
                }
            }

            // 清除筛选按钮可见性
            const clearBtn = document.getElementById('drawer-cal-clear');
            if (clearBtn) clearBtn.style.display = state.filterDateFrom ? '' : 'none';

            renderCalendar();

            renderStats();

        // ===================== 统计 =====================
        function getStatsForRange(type, refFrom, refTo) {
            const ref = refFrom ? new Date(refFrom) : new Date();
            let notes = 0, chars = 0;
            state.notes.forEach(n => {
                const d = new Date(n.timestamp);
                if (isNaN(d)) return;
                let match = false;
                if (type === 'year') match = d.getFullYear() === ref.getFullYear();
                else if (type === 'month') match = d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
                else if (type === 'week') {
                    const startOfWeek = new Date(ref);
                    startOfWeek.setDate(ref.getDate() - ref.getDay());
                    startOfWeek.setHours(0,0,0,0);
                    const endOfWeek = new Date(startOfWeek);
                    endOfWeek.setDate(startOfWeek.getDate() + 7);
                    match = d >= startOfWeek && d < endOfWeek;
                } else if (type === 'day') {
                    match = d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
                }
                if (match) {
                    notes++;
                    chars += (n.content || '').length;
                    (n.comments || []).forEach(c => { chars += (c.text || '').length; });
                }
            });
            return { notes, chars };
        }

        function statsFlip(key) {
            _statsMode[key] = (_statsMode[key] === 'chars') ? 'notes' : 'chars';
            renderStats();
        }

        function renderStats() {
            const refFrom = state.filterDateFrom;
            const total = state.notes.length;
            const totalChars = state.notes.reduce((s, n) => s + (n.content||'').length + (n.comments||[]).reduce((a,c)=>a+(c.text||'').length,0), 0);
            document.getElementById('stats-total').innerText = `共 ${total} 条笔记 · ${totalChars} 字`;

            ['year','month','week','day'].forEach(type => {
                const { notes, chars } = getStatsForRange(type, refFrom);
                const mode = _statsMode[type] || 'notes';
                const val = mode === 'notes' ? notes : chars;
                const sub = mode === 'notes' ? '条数' : '字数';
                document.getElementById(`sv-${type}`).innerText = val;
                document.getElementById(`ss-${type}`).innerText = sub;
            });

            // 纪念日联动：显示所选日期当天的纪念日
            const hint = document.getElementById('stats-special-hint');
            if (!hint) return;
            const ref = refFrom ? new Date(refFrom.replace(/\s+/g, '/')) : new Date();
            ref.setHours(0,0,0,0);
            const matched = (state.specialDays || []).filter(d => {
                let target = new Date(d.date); target.setHours(0,0,0,0);
                if (d.annual) {
                    target.setFullYear(ref.getFullYear());
                }
                return target.getTime() === ref.getTime();
            });
            if (matched.length > 0) {
                hint.style.display = 'block';
                hint.innerHTML = matched.map(d => `<span style="margin-right:8px;">${d.emoji ? d.emoji + ' ' : '✦ '}${d.name}</span>`).join('');
            } else {
                hint.style.display = 'none';
            }
        }

        // 懒加载 JSZip + FileSaver（只在导出/导入时请求）
        function loadZipLibs() {
            return new Promise((resolve, reject) => {
                if (window.JSZip && window.saveAs) { resolve(); return; }
                const s1 = document.createElement('script');
                s1.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
                s1.onload = () => {
                    const s2 = document.createElement('script');
                    s2.src = 'https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js';
                    s2.onload = resolve;
                    s2.onerror = reject;
                    document.head.appendChild(s2);
                };
                s1.onerror = reject;
                document.head.appendChild(s1);
            });
        }

        async function exportDataToZip() {
            try {
                await loadZipLibs();
                const zip = new JSZip();
                zip.file("notes.json", JSON.stringify(state.notes, null, 2));
                zip.file("settings.json", JSON.stringify(state.settings, null, 2));
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `宛宛空间备份_${new Date().toLocaleDateString()}.zip`);
                alert("✅ 导出成功！");
            } catch (e) {
                alert("❌ 导出失败：" + e.message);
            }
        }

        async function importDataFromZip(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            try {
                await loadZipLibs();
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                if (contents.files["notes.json"]) {
                    const notesStr = await contents.files["notes.json"].async("string");
                    state.notes = JSON.parse(notesStr);
                }
                if (contents.files["settings.json"]) {
                    const settingsStr = await contents.files["settings.json"].async("string");
                    state.settings = JSON.parse(settingsStr);
                }

                saveData();
                applySettings();
                renderList();
                renderTags();
                renderHistoryAvatars();
                renderHistoryBgs();
                renderFontPresets();
                renderFramePresets();
                alert("✅ 导入成功！页面已刷新数据");

                alert("❌ 导入失败：" + e.message);
            }

        }

        function updateClock() {

            const M = now.getMonth() + 1;
            const D = now.getDate();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

        function initBattery() {
            if (!navigator.getBattery) return;
            navigator.getBattery().then(bat => {
                function update() {
                    const pct = Math.round(bat.level * 100);
                    const sym = document.getElementById('battery-infinity');
                    const txt = document.getElementById('battery-text');
                    if (!sym || !txt) return;
                    // 电量<=50%只显示∞左半边（overflow:hidden + 固定宽度）
                    if (pct <= 50) {
                        sym.classList.add('half');
                    } else {
                        sym.classList.remove('half');
                    }
                    txt.innerText = pct + '%';
                }
                update();
                bat.addEventListener('levelchange', update);
                bat.addEventListener('chargingchange', update);
            });
        }

        function addFontPreset(input) {
            if (!input.files[0]) return;
            const file = input.files[0];
            const nameRaw = file.name.replace(/\.[^/.]+$/, '');
            const label = prompt('给这个字体起个名字：', nameRaw) || nameRaw;
            const reader = new FileReader();
            reader.onload = e => {
                const id = 'custom_font_' + Date.now();
                state.settings.fontPresets.push({ id, name: label, value: id, dataUrl: e.target.result, isBuiltin: false });
                state.settings.currentFont = id;
                saveData(); applySettings(); renderFontPresets();
            };
            reader.readAsDataURL(file);
            input.value = '';

        // ===================== 头像框预选 =====================
        function renderFramePresets() {
            const container = document.getElementById('frame-preset-list');
            container.innerHTML = '';
            const presets = state.settings.framePresets || [];
            presets.forEach(frame => {
                const wrapper = document.createElement('div');
                wrapper.className = 'frame-preset-item' + (state.settings.currentFrame === frame.id ? ' active' : '');

                const thumb = document.createElement('img');
                thumb.className = 'frame-preset-thumb';
                // 缩略图：无框用纯色占位，st用框gif，circle用白框，自定义用上传图
                if (frame.value === 'none') {
                    thumb.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    thumb.style.background = '#eee';
                } else if (frame.value === 'st') {
                    thumb.src = 'https://i.postimg.cc/v8xXtvMP/72ce5c0f0m16d8b4f1b050b6a2ebb6b3.gif';
                } else if (frame.value === 'circle') {
                    thumb.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    thumb.style.background = '#ccc';
                    thumb.style.border = '3px solid rgba(255,255,255,0.9)';
                } else if (frame.dataUrl) {
                    thumb.src = frame.dataUrl;
                } else if (frame.url) {
                    thumb.src = frame.url;
                }

                const label = document.createElement('div');
                label.className = 'frame-preset-label';
                label.innerText = frame.name;

                wrapper.onclick = () => {
                    state.settings.currentFrame = frame.id;
                    saveData(); applySettings(); renderFramePresets();
                };

                // 长按删除（仅自定义）
                if (!frame.isBuiltin) {
                    setupLongPress(wrapper, () => {
                        if (confirm(`删除头像框「${frame.name}」？`)) {
                            state.settings.framePresets = state.settings.framePresets.filter(f => f.id !== frame.id);
                            if (state.settings.currentFrame === frame.id) state.settings.currentFrame = 'none';
                            saveData(); applySettings(); renderFramePresets();
                        }
                    });
                }

                wrapper.appendChild(thumb);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
            });
        }

        function addFramePresetFromFile(input) {
            if (!input.files[0]) return;
            const file = input.files[0];
            const label = prompt('给这个头像框起个名字：', file.name.replace(/\.[^/.]+$/, '')) || '自定义框';
            const reader = new FileReader();
            reader.onload = e => {
                const id = 'frame_' + Date.now();
                state.settings.framePresets.push({ id, name: label, value: 'custom', dataUrl: e.target.result, isBuiltin: false });
                state.settings.currentFrame = id;
                saveData(); applySettings(); renderFramePresets();
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        function addFramePresetFromUrl(url) {
            if (!url) return;
            const label = prompt('给这个头像框起个名字：', '自定义框') || '自定义框';
            const id = 'frame_' + Date.now();
            state.settings.framePresets.push({ id, name: label, value: 'custom', url: url, isBuiltin: false });
            state.settings.currentFrame = id;
            document.getElementById('frame-preset-url-input').value = '';
            saveData(); applySettings(); renderFramePresets();
        }

        // ===================== 长按工具函数 =====================
        function setupLongPress(el, callback) {
            let timer = null;
            const start = () => {
                timer = setTimeout(() => { el.classList.add('long-pressing'); callback(); el.classList.remove('long-pressing'); }, 700);
            };
            const cancel = () => { clearTimeout(timer); el.classList.remove('long-pressing'); };
            el.addEventListener('touchstart', start, { passive: true });
            el.addEventListener('touchend', cancel);
            el.addEventListener('touchmove', cancel);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', cancel);
            el.addEventListener('mouseleave', cancel);
        }

    </script>

    <script>
        // ===================== 待机模式 =====================
        let _sbWakeLock = null;
        let _sbTimer = null;
        let _sbActive = false;
        let _sbExitTapCount = 0;
        let _sbExitTapTimer = null;

        // 待机模式设置（从 state.settings 读，fallback 默认值）
        function getSbSettings() {
            const s = (typeof state !== 'undefined' && state.settings) ? state.settings : {};
            return {
                showTodo: s.sbShowTodo !== false,
                showSpecial: s.sbShowSpecial !== false,
                showBattery: s.sbShowBattery !== false,
            };
        }

        async function enterStandby() {
            _sbActive = true;
            updateStandbyDisplay();
            _sbTimer = setInterval(updateStandbyDisplay, 10000); // 每10秒刷新（分钟级）
            document.getElementById('standby-overlay').classList.add('active');
            // WakeLock 保持屏幕常亮
            try {
                if ('wakeLock' in navigator) {
                    _sbWakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}
            // 防止系统返回键关闭app
            history.pushState({ standby: true }, '');
        }

        function exitStandby() {
            if (!_sbActive) return;
            _sbActive = false;
            clearInterval(_sbTimer);
            _sbTimer = null;
            document.getElementById('standby-overlay').classList.remove('active');
            if (_sbWakeLock) { _sbWakeLock.release().catch(()=>{}); _sbWakeLock = null; }
        }

        // 需要点击两次才退出（防误触）
        function exitStandbyOnTap(e) {
            _sbExitTapCount++;
            if (_sbExitTapCount === 1) {
                // 第一次点：底部提示高亮
                document.querySelector('.sb-exit-hint').style.opacity = '0.7';
                _sbExitTapTimer = setTimeout(() => {
                    _sbExitTapCount = 0;
                    document.querySelector('.sb-exit-hint').style.opacity = '0.22';
                }, 1500);
            } else {
                clearTimeout(_sbExitTapTimer);
                _sbExitTapCount = 0;
                document.querySelector('.sb-exit-hint').style.opacity = '0.22';
                exitStandby();
            }
        }

        // 处理浏览器返回键
        window.addEventListener('popstate', (e) => {
            if (_sbActive) exitStandby();
        });

        // WakeLock 在页面重新可见时重新请求
        document.addEventListener('visibilitychange', async () => {
            if (_sbActive && document.visibilityState === 'visible') {
                try {
                    if ('wakeLock' in navigator && !_sbWakeLock) {
                        _sbWakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch(e) {}
            }
        });

        function updateStandbyDisplay() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const yyyy = now.getFullYear();
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const weekDays = ['日','一','二','三','四','五','六'];
            const wd = '星期' + weekDays[now.getDay()];

            // 电量
            const cfg = getSbSettings();
            let batStr = '';
            const batTxt = document.getElementById('battery-text');
            if (cfg.showBattery && batTxt) {
                batStr = '🔋 ' + (batTxt.innerText || '--');
            }

            // 纪念日/特别的日子——取最近一个有倒计时的
            let specialStr = '';
            if (cfg.showSpecial && typeof state !== 'undefined' && state.specialDays && state.specialDays.length) {
                const today = new Date(yyyy, now.getMonth(), now.getDate());
                let nearest = null, nearestDays = Infinity;
                state.specialDays.forEach(sd => {
                    if (!sd.date) return;
                    const parts = sd.date.split('-').map(Number);
                    let target = new Date(parts[0], parts[1]-1, parts[2]);
                    if (sd.annual) {
                        target = new Date(today.getFullYear(), parts[1]-1, parts[2]);
                        if (target < today) target.setFullYear(target.getFullYear() + 1);
                    }
                    const diff = Math.round((target - today) / 86400000);
                    if (diff >= 0 && diff < nearestDays) {
                        nearestDays = diff;
                        nearest = sd;
                    }
                });
                if (nearest) {
                    const label = (nearest.emoji ? nearest.emoji + ' ' : '') + nearest.name;
                    specialStr = nearestDays === 0 ? `${label} 今天！` : `${label} 还有 ${nearestDays} 天`;
                }
            }

            // 最近一条未完成 todo
            let todoStr = '';
            if (cfg.showTodo && typeof state !== 'undefined' && state.notes) {
                // 找最近一条含有未完成todo项的note
                for (let i = state.notes.length - 1; i >= 0; i--) {
                    const n = state.notes[i];
                    if (n.isTodo && n.todoItems && n.todoItems.length) {
                        const pending = n.todoItems.filter(t => !t.done);
                        if (pending.length) {
                            todoStr = '☐ ' + pending[0].text;
                            break;
                        }
                    }
                }
            }

            const dateStr = `${yyyy}年${mo}月${dd}日`;

            // 填入竖屏
            _sbSet('sb-p-hour', hh);
            _sbSet('sb-p-min', mm);
            _sbSet('sb-p-date', dateStr);
            _sbSet('sb-p-weekday', wd);
            _sbSetOptional('sb-p-battery', batStr, cfg.showBattery);
            _sbSetOptional('sb-p-special', specialStr, cfg.showSpecial && specialStr);
            _sbSetOptional('sb-p-todo', todoStr, cfg.showTodo && todoStr);

            // 填入横屏
            _sbSet('sb-l-time', hh + ':' + mm);
            _sbSet('sb-l-date', dateStr);
            _sbSet('sb-l-weekday', wd);
            _sbSetOptional('sb-l-battery', batStr, cfg.showBattery);
            _sbSetOptional('sb-l-special', specialStr, cfg.showSpecial && specialStr);
            _sbSetOptional('sb-l-todo', todoStr, cfg.showTodo && todoStr);
        }

        function _sbSet(id, val) {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        }
        function _sbSetOptional(id, val, show) {
            const el = document.getElementById(id);
            if (!el) return;
            if (show && val) {
                el.textContent = val;
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }
        // ===================== 待机模式 END =====================
    </script>

    <script>
        // ===================== 抽屉 & 模式切换 =====================

        // --- 模式专属背景 ---
        function changeModeBg(input, key) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                state.settings[key] = e.target.result;
                saveData();
                applySettings();
            };

            input.value = '';
        }
        function clearModeBg() {
            const modeKey = { note: 'bgNote', todo: 'bgTodo', pomodoro: 'bgPomodoro' };
            const key = modeKey[_currentMode] || 'bgNote';
            state.settings[key] = '';

            applySettings();
