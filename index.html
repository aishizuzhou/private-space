        // --- 抽屉开关 ---
        function openDrawer() {
            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawer-overlay').classList.add('open');
            document.body.classList.add('drawer-open');
            // 同步头像和昵称
            const mainAvatar = document.getElementById('current-avatar');
            const drawerAvatar = document.getElementById('drawer-avatar-img');
            if (mainAvatar && drawerAvatar) drawerAvatar.src = mainAvatar.src;
            const nameEl = document.getElementById('display-name');
            const drawerName = document.getElementById('drawer-display-name');
            if (nameEl && drawerName) drawerName.textContent = nameEl.textContent;
            // 同步 tag 筛选
            syncDrawerTags();
            // 初始化日历（重置到本月）
            const now = new Date();
            _calYear = now.getFullYear();
            _calMonth = now.getMonth();
            _calPickStep = 0;
            _calLastClick = null;
            state.filterDateFrom = null;
            state.filterDateTo = null;
            renderCalendar();
            // 清除筛选按钮初始隐藏
            const clearBtn = document.getElementById('drawer-cal-clear');
            if (clearBtn) clearBtn.style.display = 'none';
            // 统计
            renderStats();
            // 设置同步
            applySettings();
            renderFontPresets();
            renderFramePresets();
            renderHistoryAvatars();
            renderHistoryBgs();
            const s = state.settings;
            const elTodo = document.getElementById('sb-show-todo');
            const elSpecial = document.getElementById('sb-show-special');
            if (elTodo) elTodo.checked = s.sbShowTodo !== false;
            if (elSpecial) elSpecial.checked = s.sbShowSpecial !== false;
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
            document.body.classList.remove('drawer-open');
        }

        // --- 右滑手势触发抽屉 ---
        (function initDrawerSwipe() {
            let startX = 0, startY = 0, dragging = false;
            const TRIGGER_ZONE = 28; // 从左边缘多少px内起始才触发
            const MIN_SWIPE = window.innerWidth * 0.35; // 需要滑动屏幕35%以上

            document.addEventListener('touchstart', e => {
                if (document.getElementById('drawer').classList.contains('open')) return;
                if (document.getElementById('standby-overlay').classList.contains('active')) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragging = startX < TRIGGER_ZONE;
            }, { passive: true });

            document.addEventListener('touchend', e => {
                if (!dragging) return;
                dragging = false;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = Math.abs(e.changedTouches[0].clientY - startY);
                if (dx > MIN_SWIPE && dy < 80) openDrawer();
            }, { passive: true });
        })();

        // --- 同步 tag 到抽屉 ---
        function syncDrawerTags() {
            const mainTags = document.getElementById('tag-filters');
            const drawerTags = document.getElementById('drawer-tag-filters');
            if (!mainTags || !drawerTags) return;
            drawerTags.innerHTML = mainTags.innerHTML;
            // 给抽屉里的 tag 重新绑定 onclick
            drawerTags.querySelectorAll('.filter-tag').forEach(el => {
                const tag = el.dataset.tag;
                el.onclick = () => {
                    filterByTag(tag);
                    closeDrawer();
                };
            });
        }

        // --- 同步统计到抽屉 ---
        // --- 模式切换 & 墨水扩散 ---
        const MODES = ['note', 'todo', 'pomodoro'];
        const MODE_COLORS = { note: '#bbe0e2', todo: '#eefbe0', pomodoro: '#e6d0e3' };
        const MODE_LABELS = { note: '笔记', todo: '待办', pomodoro: '番茄' };
        let _currentMode = 'note';

        function cycleMode(e) {
            e.stopPropagation();
            const dot = document.getElementById('mode-dot');
            const rect = dot.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const idx = MODES.indexOf(_currentMode);
            _currentMode = MODES[(idx + 1) % MODES.length];
            const color = MODE_COLORS[_currentMode];

            // 更新点颜色
            dot.dataset.mode = _currentMode;

            // 墨水扩散
            triggerInkSplash(cx, cy, color, () => {
                // 扩散中途切换内容（如果以后有不同模式下的内容）
                applyModeView(_currentMode);
            });
        }

        function triggerInkSplash(cx, cy, color, midCallback) {
            const splash = document.getElementById('ink-splash');
            splash.innerHTML = '';
            const size = Math.max(window.innerWidth, window.innerHeight) * 2.2;
            const circle = document.createElement('div');
            circle.className = 'ink-circle';
            circle.style.cssText = `
                width: ${size}px; height: ${size}px;
                background: ${color};
                left: ${cx - size/2}px; top: ${cy - size/2}px;
            `;
            splash.appendChild(circle);

            // 触发动画
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    circle.classList.add('expanding');
                });
            });

            // 中途回调（扩散峰值时）
            setTimeout(() => {
                if (midCallback) midCallback();
            }, 280);

            // 清理
            setTimeout(() => {
                splash.innerHTML = '';
            }, 700);
        }

        function applyModeView(mode) {
            state.currentMode = mode;
            state.settings.lastMode = mode;
            saveData();
            applySettings();

            // 切换页面显示
            const pageNote = document.getElementById('page-note');
            const pageTodo = document.getElementById('page-todo');
            const pagePomo = document.getElementById('page-pomodoro');
            if (pageNote) pageNote.style.display = mode === 'note' ? 'flex' : 'none';
            if (pageTodo) pageTodo.style.display = mode === 'todo' ? 'flex' : 'none';
            if (pagePomo) pagePomo.style.display = mode === 'pomodoro' ? 'flex' : 'none';

            // FAB 只在笔记模式显示
            const fab = document.getElementById('main-fab');
            if (fab) fab.style.display = mode === 'note' ? '' : 'none';

            // 笔记模式隐藏编辑器里的「待办」切换按钮
            const todoModeBtn = document.getElementById('todo-mode-btn');
            if (todoModeBtn) todoModeBtn.style.display = mode === 'note' ? 'none' : '';

            if (mode === 'note') {
                renderList();
            } else if (mode === 'todo') {
                renderTodoPage();
            }
        }

        // ===================== Todo 分区页面 =====================
        // 数据结构：state.todoSections = [{id, name, items:[{id,text,done}]}]
        // localStorage key: wanwan_todo_sections

        function loadTodoSections() {
            try {
                const raw = localStorage.getItem('wanwan_todo_sections');
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return [
                { id: 'sec_1', name: '分区 1', items: [] },
                { id: 'sec_2', name: '分区 2', items: [] }
            ];
        }
        function saveTodoSections() {
            localStorage.setItem('wanwan_todo_sections', JSON.stringify(state.todoSections));
        }
        if (!state.todoSections) state.todoSections = loadTodoSections();
        let _currentSectionId = state.todoSections[0]?.id || 'sec_1';

        function renderTodoPage() {
            renderTodoTabs();
            renderTodoList();
        }

        function renderTodoTabs() {
            const container = document.getElementById('todo-tabs');
            if (!container) return;
            container.innerHTML = '';
            state.todoSections.forEach(sec => {
                const btn = document.createElement('button');
                btn.className = 'todo-tab-btn' + (sec.id === _currentSectionId ? ' active' : '');
                btn.textContent = sec.name;
                btn.onclick = () => { _currentSectionId = sec.id; renderTodoPage(); };
                // 长按重命名
                setupLongPress(btn, () => {
                    const newName = prompt('分区名称：', sec.name);
                    if (newName && newName.trim()) {
                        sec.name = newName.trim();
                        saveTodoSections();
                        renderTodoTabs();
                    }
                });
                container.appendChild(btn);
            });
            // 新增分区按钮
            const addBtn = document.createElement('button');
            addBtn.className = 'todo-tab-btn add-section';
            addBtn.textContent = '＋';
            addBtn.title = '新增分区';
            addBtn.onclick = () => {
                const name = prompt('新分区名称：', `分区 ${state.todoSections.length + 1}`);
                if (!name) return;
                const sec = { id: 'sec_' + Date.now(), name: name.trim(), items: [] };
                state.todoSections.push(sec);
                _currentSectionId = sec.id;
                saveTodoSections();
                renderTodoPage();
            };
            container.appendChild(addBtn);
        }

        function renderTodoList() {
            const container = document.getElementById('todo-list-area');
            if (!container) return;
            container.innerHTML = '';
            const sec = state.todoSections.find(s => s.id === _currentSectionId);
            if (!sec) return;
            if (sec.items.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.3;font-size:0.85rem;padding:40px 0;">还没有待办</div>';
                return;
            }
            // 未完成的在前
            const sorted = [...sec.items].sort((a,b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
            sorted.forEach(item => {
                const card = document.createElement('div');
                card.className = 'todo-item-card' + (item.done ? ' done' : '');
                card.innerHTML = `
                    <div class="todo-check">${item.done ? '✓' : ''}</div>
                    <div class="todo-item-text">${item.text}</div>
                `;
                card.onclick = () => {
                    item.done = !item.done;
                    saveTodoSections();
                    renderTodoList();
                };
                // 长按删除
                setupLongPress(card, () => {
                    sec.items = sec.items.filter(i => i.id !== item.id);
                    saveTodoSections();
                    renderTodoList();
                });
                container.appendChild(card);
            });
        }

        function addTodoToSection() {
            const input = document.getElementById('todo-new-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            const sec = state.todoSections.find(s => s.id === _currentSectionId);
            if (!sec) return;
            sec.items.push({ id: Date.now(), text, done: false });
            saveTodoSections();
            input.value = '';
            renderTodoList();
        }
        // ===================== Todo 分区页面 END =====================

        // --- 番茄钟 ---
        let _pomoRunning = false;
        let _pomoSeconds = 25 * 60;
        let _pomoInterval = null;
        const POMO_DURATION = 25 * 60;

        function pomoTick() {
            if (_pomoSeconds <= 0) {
                pomoReset();
                document.getElementById('pomo-label').textContent = '完成！';
                return;
            }
            _pomoSeconds--;
            renderPomoTimer();
        }
        function renderPomoTimer() {
            const m = String(Math.floor(_pomoSeconds / 60)).padStart(2, '0');
            const s = String(_pomoSeconds % 60).padStart(2, '0');
            const el = document.getElementById('pomo-timer');
            if (el) el.textContent = `${m}:${s}`;
        }
        function pomoToggle() {
            const btn = document.getElementById('pomo-btn');
            const label = document.getElementById('pomo-label');
            if (_pomoRunning) {
                clearInterval(_pomoInterval); _pomoInterval = null;
                _pomoRunning = false;
                if (btn) btn.textContent = '继续';
                if (label) label.textContent = '已暂停';
            } else {
                _pomoRunning = true;
                _pomoInterval = setInterval(pomoTick, 1000);
                if (btn) btn.textContent = '暂停';
                if (label) label.textContent = '专注中';
            }
        }
        function pomoReset() {
            clearInterval(_pomoInterval); _pomoInterval = null;
            _pomoRunning = false;
            _pomoSeconds = POMO_DURATION;
            renderPomoTimer();
            const btn = document.getElementById('pomo-btn');
            const label = document.getElementById('pomo-label');
            if (btn) btn.textContent = '开始';
            if (label) label.textContent = '专注中';
        }

        // 初始化：从 state 恢复模式
        window.addEventListener('load', () => {
            const savedMode = (typeof state !== 'undefined' && state.settings && state.settings.lastMode) || 'note';
            _currentMode = savedMode;
            const dot = document.getElementById('mode-dot');
            if (dot) dot.dataset.mode = _currentMode;
        });

        // ===================== 抽屉 & 模式切换 END =====================
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
